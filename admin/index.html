<!doctype html>
<!-- V2.4 PAGE CONFIG EDITOR: edits one data/pages JSON file at a time. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Allstar Galaxy Page Configuration</title><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/base.css"><style>body{padding:28px}.admin{max-width:1100px;margin:auto;padding:28px;border:1px solid #888;border-radius:16px;background:rgba(8,10,18,.93)}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}select,button,input{padding:11px 13px;border:1px solid #888;border-radius:8px;color:#fff;background:#02040a}button{cursor:pointer}.hero-list{display:grid;gap:10px;margin-block:18px}.hero-row{display:grid;grid-template-columns:1fr auto auto;gap:8px}textarea{width:100%;min-height:360px;padding:15px;color:#fff;background:#02040a}.help{color:#c2c7d2;line-height:1.55}@media(max-width:700px){body{padding:0}.admin{border-radius:0;padding:18px}.hero-row{grid-template-columns:1fr}}</style></head><body><main class="admin"><h1>Allstar Galaxy Page Configuration</h1><p class="help">Hero images can be added, removed, and reordered. The carousel creates one dot for every image path.</p><div class="toolbar"><label for="page">Page</label><select id="page"></select><button id="load">Reload Page</button><button id="addHero">Add Hero Image</button><button id="applyHeroes">Apply Hero List</button><button id="download">Download JSON</button></div><h2>Hero Images</h2><div id="heroList" class="hero-list"></div><h2>Complete Page JSON</h2><textarea id="editor" spellcheck="false"></textarea></main><script type="module" src="admin.js"></script></body></html>
