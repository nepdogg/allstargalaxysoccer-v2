<!doctype html>
<!-- ALLSTAR GALAXY V2 PAGE ARCHITECTURE
     Shared header/status/hero/footer: js/app.js + js/site-frame.js
     Page-only content: the css/pages and js/pages files linked below.
     This separation prevents one page update from changing another page. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060b">
  <title>Galaxy Shuffle | Allstar Galaxy</title>
  <link rel="icon" href="assets/images/icons/favicon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/shuffle.css">
</head>
<body data-page="shuffle">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-frame"></div>
  <main id="main" class="page-main" tabindex="-1">
    <div id="page-content" class="page-content" aria-live="polite"></div>
  </main>
  <div id="site-footer"></div>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/shuffle.js"></script>
</body>
</html>
